<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мое Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем красивый шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Меняем шрифт на более современный */
        body { 
            font-family: 'Montserrat', -apple-system, sans-serif; 
            background: var(--tg-theme-bg-color, #FAFAFA); 
            color: var(--tg-theme-text-color, #222);
            padding: 15px; 
            margin: 0;
        }
        h1 { text-align: center; font-size: 24px; font-weight: 700; margin-bottom: 25px; letter-spacing: -0.5px; }
        
        .catalog { display: flex; flex-direction: column; gap: 15px; }
        
        /* Карточка стала более стильной */
        .card { 
            background: var(--tg-theme-secondary-bg-color, #ffffff); 
            border-radius: 18px; 
            padding: 12px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04); 
            border: 1px solid rgba(0,0,0,0.03);
        }
        
        .info { display: flex; align-items: center; gap: 15px; }
        
        /* Стили для реальных фото вместо эмодзи */
        .product-img {
            width: 65px;
            height: 65px;
            border-radius: 12px;
            object-fit: cover; /* Чтобы фото не сплющивалось */
        }
        
        .details h3 { margin: 0 0 5px 0; font-size: 16px; font-weight: 600; }
        .details p { margin: 0; font-size: 13px; color: #888; }
        
        .price { font-weight: 700; font-size: 16px; margin-right: 12px; color: #8B5A2B; /* Кофейный цвет */ }
        
        /* Кнопка плюса */
        .add-btn { 
            background: #8B5A2B; /* Кофейный цвет */ 
            color: #fff; 
            border: none; 
            border-radius: 50%; 
            width: 36px; 
            height: 36px; 
            font-size: 22px; 
            font-weight: bold;
            cursor: pointer; 
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 3px 8px rgba(139, 90, 43, 0.3);
        }
        
        .cart { 
            margin-top: 30px; 
            background: var(--tg-theme-secondary-bg-color, #ffffff); 
            border-radius: 18px; 
            padding: 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.03);
        }
        .cart h3 { margin-top: 0; text-align: center; font-weight: 600; }
        
        input { 
            width: 100%; 
            padding: 14px; 
            margin-bottom: 12px; 
            border-radius: 12px; 
            border: 1px solid rgba(128, 128, 128, 0.2); 
            background: var(--tg-theme-bg-color, #FAFAFA); 
            color: var(--tg-theme-text-color, #000); 
            box-sizing: border-box; 
            font-size: 15px;
            font-family: 'Montserrat', sans-serif;
        }
        
        /* Главная кнопка оформления */
        .checkout-btn { 
            background: #8B5A2B; /* Кофейный цвет */ 
            color: #fff; 
            border: none; 
            padding: 16px; 
            border-radius: 12px; 
            width: 100%; 
            font-size: 16px; 
            font-weight: 700; 
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(139, 90, 43, 0.3);
            font-family: 'Montserrat', sans-serif;
        }
    </style>
</head>
<body>
    <h1>☕ Меню кофейни</h1>
    
    <div class="catalog" id="catalog"></div>
    
    <div class="cart">
        <h3>Ваш заказ: <span id="total-price" style="color: #8B5A2B;">0</span> ₽</h3>
        <input type="text" id="client-name" placeholder="Ваше имя">
        <input type="tel" id="client-phone" placeholder="Телефон или столик">
        <button class="checkout-btn" id="checkout-btn">Оформить заказ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        const BOT_TOKEN = "8717110711:AAEYx8S8dnn6103TmdT8xh2SEaGPgAw71Ao";
        const MY_CHAT_ID = "7948923802";

        // ⚠️ Обрати внимание: теперь вместо emoji мы используем img (ссылки на фото)
        const products = [
            { 
                id: 1, 
                name: "Капучино", 
                desc: "Нежная пенка", 
                price: 200, 
                img: "https://images.unsplash.com/photo-1509042239860-f550ce710b93?q=80&w=200&auto=format&fit=crop" 
            },
            { 
                id: 2, 
                name: "Круассан", 
                desc: "С маслом", 
                price: 150, 
                img: "https://images.unsplash.com/photo-1555507036-ab1f4038808a?q=80&w=200&auto=format&fit=crop" 
            },
            { 
                id: 3, 
                name: "Латте", 
                desc: "С сиропом", 
                price: 250, 
                img: "https://images.unsplash.com/photo-1461023058943-07fcbe16d735?q=80&w=200&auto=format&fit=crop" 
            }
        ];

        let cartTotal = 0;
        let cartItems = []; 

        const catalogDiv = document.getElementById('catalog');
        
        products.forEach(product => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="info">
                    <img src="${product.img}" class="product-img" alt="${product.name}">
                    <div class="details">
                        <h3>${product.name}</h3>
                        <p>${product.desc}</p>
                    </div>
                </div>
                <div style="display: flex; align-items: center;">
                    <div class="price">${product.price} ₽</div>
                    <button class="add-btn" onclick="addToCart(${product.id})">+</button>
                </div>
            `;
            catalogDiv.appendChild(card);
        });

        window.addToCart = function(id) {
            const product = products.find(p => p.id === id);
            cartTotal += product.price;
            cartItems.push(product.name);
            document.getElementById('total-price').innerText = cartTotal;
            if (tg) tg.HapticFeedback.impactOccurred('light');
        };

        document.getElementById('checkout-btn').addEventListener('click', () => {
            if (cartTotal === 0) {
                if (tg) tg.showAlert('Вы ничего не выбрали!'); else alert('Вы ничего не выбрали!');
                return;
            }

            const name = document.getElementById('client-name').value.trim();
            const phone = document.getElementById('client-phone').value.trim();

            if (!name || !phone) {
                if (tg) tg.showAlert('Пожалуйста, заполните имя и контакт!'); else alert('Пожалуйста, заполните имя и контакт!');
                return;
            }

            const orderText = `🔥 НОВЫЙ ЗАКАЗ!\n\n👤 Имя: ${name}\n📞 Контакт: ${phone}\n\n🍔 Состав: ${cartItems.join(', ')}\n💰 Итого: ${cartTotal} ₽`;
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${MY_CHAT_ID}&text=${encodeURIComponent(orderText)}`;

            fetch(url)
                .then(response => {
                    if (response.ok) {
                        if (tg) tg.showAlert('Заказ успешно отправлен! Мы скоро свяжемся.'); else alert('Заказ отправлен (тест в браузере)!');
                        if (tg) tg.HapticFeedback.notificationOccurred('success');
                        cartTotal = 0;
                        cartItems = [];
                        document.getElementById('total-price').innerText = cartTotal;
                        document.getElementById('client-name').value = '';
                        document.getElementById('client-phone').value = '';
                    } else {
                        if (tg) tg.showAlert('Ошибка при отправке.'); else alert('Ошибка отправки!');
                    }
                })
                .catch(error => {
                    if (tg) tg.showAlert('Ошибка сети. Попробуйте позже.');
                });
        });
    </script>
</body>
</html>
