<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мое Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--tg-theme-bg-color, #f4f4f5); color: var(--tg-theme-text-color, #000); padding: 15px; margin: 0; }
        h1 { text-align: center; font-size: 24px; margin-bottom: 20px; }
        .catalog { display: flex; flex-direction: column; gap: 15px; }
        .card { background: var(--tg-theme-secondary-bg-color, #ffffff); border-radius: 14px; padding: 15px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .info { display: flex; align-items: center; gap: 15px; }
        .emoji { font-size: 35px; }
        .details h3 { margin: 0; font-size: 16px; }
        .details p { margin: 4px 0 0; font-size: 13px; color: #888; }
        .price { font-weight: bold; font-size: 15px; margin-right: 10px; }
        .add-btn { background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); border: none; border-radius: 50%; width: 35px; height: 35px; font-size: 20px; cursor: pointer; }
        .cart { margin-top: 25px; background: var(--tg-theme-secondary-bg-color, #ffffff); border-radius: 14px; padding: 20px; }
        .cart h3 { margin-top: 0; text-align: center; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid rgba(128, 128, 128, 0.2); background: var(--tg-theme-bg-color, #f4f4f5); color: var(--tg-theme-text-color, #000); box-sizing: border-box; font-size: 15px; }
        .checkout-btn { background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); border: none; padding: 15px; border-radius: 10px; width: 100%; font-size: 16px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>☕ Меню кофейни</h1>
    
    <!-- Сюда скрипт добавляет карточки товаров -->
    <div class="catalog" id="catalog"></div>
    
    <div class="cart">
        <h3>Ваш заказ: <span id="total-price">0</span> ₽</h3>
        <input type="text" id="client-name" placeholder="Ваше имя">
        <input type="tel" id="client-phone" placeholder="Телефон или столик">
        <button class="checkout-btn" id="checkout-btn">Оформить заказ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const BOT_TOKEN = "8717110711:AAEYx8S8dnn6103TmdT8xh2SEaGPgAw71Ao";
        const MY_CHAT_ID = "7948923802";

        // Список товаров
        const products = [
            { id: 1, name: "Капучино", desc: "Нежная пенка", price: 200, emoji: "☕" },
            { id: 2, name: "Круассан", desc: "С маслом", price: 150, emoji: "🥐" },
            { id: 3, name: "Латте", desc: "С сиропом", price: 250, emoji: "🥛" }
        ];

        let cartTotal = 0;
        let cartItems = []; 

        const catalogDiv = document.getElementById('catalog');
        
        // Отрисовка товаров
        products.forEach(product => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="info">
                    <div class="emoji">${product.emoji}</div>
                    <div class="details">
                        <h3>${product.name}</h3>
                        <p>${product.desc}</p>
                    </div>
                </div>
                <div style="display: flex; align-items: center;">
                    <div class="price">${product.price} ₽</div>
                    <button class="add-btn" onclick="addToCart(${product.id})">+</button>
                </div>
            `;
            catalogDiv.appendChild(card);
        });

        // Добавление в корзину
        window.addToCart = function(id) {
            const product = products.find(p => p.id === id);
            cartTotal += product.price;
            cartItems.push(product.name);
            document.getElementById('total-price').innerText = cartTotal;
            if (tg) tg.HapticFeedback.impactOccurred('light');
        };

        // Оформление заказа
        document.getElementById('checkout-btn').addEventListener('click', () => {
            if (cartTotal === 0) {
                if (tg) tg.showAlert('Вы ничего не выбрали!');
                return;
            }

            const name = document.getElementById('client-name').value.trim();
            const phone = document.getElementById('client-phone').value.trim();

            if (!name || !phone) {
                if (tg) tg.showAlert('Пожалуйста, заполните имя и контакт!');
                return;
            }

            const orderText = `🔥 НОВЫЙ ЗАКАЗ!\n\n👤 Имя: ${name}\n📞 Контакт: ${phone}\n\n🍔 Состав: ${cartItems.join(', ')}\n💰 Итого: ${cartTotal} ₽`;

            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${MY_CHAT_ID}&text=${encodeURIComponent(orderText)}`;

            fetch(url)
                .then(response => {
                    if (response.ok) {
                        if (tg) tg.showAlert('Заказ успешно отправлен! Мы скоро свяжемся.');
                        tg.HapticFeedback.notificationOccurred('success');
                        cartTotal = 0;
                        cartItems = [];
                        document.getElementById('total-price').innerText = cartTotal;
                        document.getElementById('client-name').value = '';
                        document.getElementById('client-phone').value = '';
                    } else {
                        if (tg) tg.showAlert('Ошибка при отправке.');
                    }
                })
                .catch(error => {
                    if (tg) tg.showAlert('Ошибка сети. Попробуйте позже.');
                });
        });
    </script>
</body>
</html>
